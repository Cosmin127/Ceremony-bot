<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ceremony bot thingy</title>

    <style>

        body {

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f4f4;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            margin: 0;

        }

        .container {

            width: 500px;

            background: white;

            padding: 40px;

            box-shadow: 0 10px 25px rgba(0,0,0,.1);

            text-align: center;

        }

        h1 {

            margin-top: 0;

        }

        .upload-box {

            border: 3px dashed #888;

            padding: 40px;

            margin: 25px 0;

        }

        input[type=file] {

            width: 100%;

        }

        .format {

            text-align: left;

            margin-top: 20px;

        }

        .format h3 {

            margin-bottom: 10px;

        }

        .format label {

            display: block;

            margin: 8px 0;

            cursor: pointer;

        }

        #excel-options {

            text-align: left;

            margin-top: 20px;

        }

        #excel-options input {

            width: 100%;

            padding: 8px;

            box-sizing: border-box;

        }

        button {

            margin-top: 30px;

            width: 100%;

            padding: 15px;

            font-size: 18px;

            cursor: pointer;

            border: none;

            background: #2b6cb0;

            color: white;

        }

        button:hover {

            background: #1f4f82;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Ceremony bot</h1>

    <p>

        upload a ceremony document pls (.txt)

    </p>

    <form
        action="/generate"
        method="POST"
        enctype="multipart/form-data">

        <div class="upload-box">

            <input
                type="file"
                name="file"
                accept=".txt"
                required>

        </div>

        <div class="format">

            <h3>Output format</h3>

            <label>
                <input
                    type="radio"
                    name="output"
                    value="excel"
                    checked>
                Excel (.xlsx for medal sheet)
            </label>

            <label>
                <input
                    type="radio"
                    name="output"
                    value="json">
                JSON (for discord auto role bot)
            </label>

        </div>

        <div id="excel-options">

            <h3>Excel options</h3>

            <label for="reason">
                Reason
            </label>

            <input
                type="text"
                id="reason"
                name="reason"
                placeholder="Reason">

            <br><br>

            <label for="logged_by">
                Logged By
            </label>

            <input
                type="text"
                id="logged_by"
                name="logged_by"
                placeholder="Your roblox username">

        </div>

        <button type="submit">

            Generate

        </button>

    </form>

</div>

<script>

const excelOptions = document.getElementById("excel-options");

const outputButtons = document.querySelectorAll('input[name="output"]');

function updateOutputOptions() {

    const selected = document.querySelector('input[name="output"]:checked').value;

    if (selected === "excel") {

        excelOptions.style.display = "block";

    } else {

        excelOptions.style.display = "none";

    }

}

outputButtons.forEach(button => {

    button.addEventListener("change", updateOutputOptions);

});

updateOutputOptions();

</script>

</body>

</html>
