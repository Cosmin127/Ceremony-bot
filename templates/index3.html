<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ceremony Bot</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            margin: 0;
            position: relative;
            overflow: hidden;
            background: #0a0a12;
        }

        /* Scrolling background */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            filter: blur(8px) brightness(0.4);
            transform: scale(1.1);
        }

        .bg-scroll {
            position: absolute;
            left: 0;
            width: 100%;
            animation: scrollBackground 30s linear infinite;
        }

        .bg-scroll img {
            width: 100%;
            display: block;
        }

        .bg-scroll .duplicate {
            margin-top: 0;
        }

        @keyframes scrollBackground {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-50%);
            }
        }

        .overlay-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(ellipse at center, rgba(10, 10, 18, 0.3) 0%, rgba(10, 10, 18, 0.7) 100%);
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 45px;
            max-width: 1100px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #a38a56, transparent);
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        /* LEFT COLUMN - Eagle, Motto, Upload */
        .left-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }

        .left-col .header-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        .left-col .header-logo img {
            height: 280px;
            width: auto;
            opacity: 0.95;
        }

        .left-col .motto {
            color: #a38a56;
            font-family: 'Times New Roman', Times, serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 22px;
            text-shadow: 0 0 40px rgba(163, 138, 86, 0.15);
            text-align: center;
        }

        .upload-area {
            width: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-area:hover {
            border-color: rgba(163, 138, 86, 0.4);
            background: rgba(255, 255, 255, 0.04);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
            opacity: 0.7;
        }

        .upload-area .label {
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 15px;
            font-weight: 500;
        }

        .upload-area .sub-label {
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Times New Roman', Times, serif;
            font-size: 12px;
            margin-top: 4px;
        }

        .upload-area.dragover {
            border-color: #a38a56;
            background: rgba(163, 138, 86, 0.06);
        }

        .file-name {
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Times New Roman', Times, serif;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        .file-name.show {
            display: block;
        }

        .file-name span {
            color: #a38a56;
        }

        /* RIGHT COLUMN - Form Fields */
        .right-col {
            padding-top: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Times New Roman', Times, serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input[type="text"]:focus {
            border-color: #a38a56;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px rgba(163, 138, 86, 0.05);
        }

        .form-group input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .toggle-group {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-group label {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Times New Roman', Times, serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            transition: all 0.3s ease;
            text-transform: none;
            letter-spacing: 0;
        }

        .toggle-group label:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .toggle-group input[type="radio"] {
            display: none;
        }

        .toggle-group input[type="radio"]:checked + label {
            background: rgba(163, 138, 86, 0.12);
            color: #a38a56;
            box-shadow: 0 4px 12px rgba(163, 138, 86, 0.06);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            margin-top: 2px;
        }

        .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Times New Roman', Times, serif;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 400;
        }

        .checkbox-grid label:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
        }

        .checkbox-grid input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            background: transparent;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .checkbox-grid input[type="checkbox"]:checked {
            background: #a38a56;
            border-color: #a38a56;
        }

        .checkbox-grid input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #1a1a2e;
            font-size: 10px;
            font-weight: 700;
        }

        .section-title {
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Times New Roman', Times, serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 14px 0 6px 0;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a38a56, #8a7448);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(163, 138, 86, 0.2);
            background: linear-gradient(135deg, #b89a64, #a38a56);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.06), transparent);
            margin: 18px 0;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .two-col {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .left-col .header-logo img {
                height: 180px;
            }
            .container {
                padding: 30px 25px;
            }
            .left-col .motto {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .checkbox-grid {
                grid-template-columns: 1fr 1fr;
            }
            .left-col .header-logo img {
                height: 120px;
            }
            .left-col .motto {
                font-size: 18px;
            }
        }

    </style>

</head>

<body>

    <!-- Scrolling Background -->
    <div class="bg-wrapper">
        <div class="bg-scroll" id="bgScroll">
            <img src="/static/sheet-bg.png" alt="Background">
            <img src="/static/sheet-bg.png" alt="Background" class="duplicate">
        </div>
    </div>

    <!-- Overlay for readability -->
    <div class="overlay-gradient"></div>

    <div class="container">

        <div class="two-col">

            <!-- LEFT COLUMN - Eagle, Motto, Upload -->
            <div class="left-col">

                <div class="header-logo">
                    <img src="/static/eagle.png" alt="Austrian Eagle" id="eagleLogo">
                </div>

                <div class="motto">Meritocracy Reigns Supreme.</div>

                <div class="upload-area" id="dropZone">
                    <span class="upload-icon">📜</span>
                    <div class="label">Drop your .txt file here</div>
                    <div class="sub-label">or click to browse</div>
                    <input type="file" name="file" accept=".txt" required="" id="fileInput">
                    <div class="file-name" id="fileName">Selected: <span id="fileNameText"></span></div>
                </div>

            </div>

            <!-- RIGHT COLUMN - Form Fields -->
            <div class="right-col">

                <form action="/generate" method="POST" enctype="multipart/form-data">

                    <div class="form-row">
                        <div class="form-group">
                            <label>Reason</label>
                            <input type="text" name="reason" placeholder="e.g. Austrian Nation Wide">
                        </div>
                        <div class="form-group">
                            <label>Logged By</label>
                            <input type="text" name="logged_by" placeholder="Your Roblox username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Ceremony Format</label>
                        <div class="toggle-group">
                            <input type="radio" name="ceremony_type" value="eu_na" id="eu_na" checked="">
                            <label for="eu_na">🌎 EU / NA</label>
                            <input type="radio" name="ceremony_type" value="asia" id="asia">
                            <label for="asia">🌏 Asia</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Output Format</label>
                        <div class="toggle-group">
                            <input type="radio" name="output" value="excel" id="excel" checked="">
                            <label for="excel">📊 Excel</label>
                            <input type="radio" name="output" value="json" id="json">
                            <label for="json">📋 JSON</label>
                        </div>
                    </div>

                    <div id="excel-options" style="display: block;">

                        <div class="section-title">Exclude Clasps</div>

                        <div style="color: rgba(255,255,255,0.25); font-family: 'Times New Roman', Times, serif; font-size: 11px; margin-bottom: 6px; letter-spacing: 1px;">Medals</div>
                        <div class="checkbox-grid">
                            <label><input type="checkbox" name="exclude_bronze"> Bronze</label>
                            <label><input type="checkbox" name="exclude_silver"> Silver</label>
                            <label><input type="checkbox" name="exclude_gold"> Gold</label>
                            <label><input type="checkbox" name="exclude_no"> No Clasp</label>
                        </div>

                        <div style="color: rgba(255,255,255,0.25); font-family: 'Times New Roman', Times, serif; font-size: 11px; margin-top: 10px; margin-bottom: 6px; letter-spacing: 1px;">Orders</div>
                        <div class="checkbox-grid">
                            <label><input type="checkbox" name="exclude_knappe"> Knappe</label>
                            <label><input type="checkbox" name="exclude_ritter"> Ritter</label>
                            <label><input type="checkbox" name="exclude_kommandeur"> Kommandeur</label>
                            <label><input type="checkbox" name="exclude_grossmeister"> Großmeister</label>
                            <label><input type="checkbox" name="exclude_hochmeister"> Hochmeister</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Generate</button>

                </form>

            </div>

        </div>

    </div>

    <script>

        // File upload drag & drop
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const fileNameText = document.getElementById('fileNameText');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileName();
            }
        });

        fileInput.addEventListener('change', updateFileName);

        function updateFileName() {
            if (fileInput.files.length) {
                fileNameText.textContent = fileInput.files[0].name;
                fileName.classList.add('show');
            } else {
                fileName.classList.remove('show');
            }
        }

        // Toggle Excel options visibility
        const excelOptions = document.getElementById('excel-options');
        const outputButtons = document.querySelectorAll('input[name="output"]');

        function updateOutputOptions() {
            const selected = document.querySelector('input[name="output"]:checked');
            excelOptions.style.display = selected && selected.value === 'excel' ? 'block' : 'none';
        }

        outputButtons.forEach(button => {
            button.addEventListener('change', updateOutputOptions);
        });

        updateOutputOptions();

        // Handle missing eagle image gracefully
        document.getElementById('eagleLogo').addEventListener('error', function() {
            this.style.display = 'none';
        });

    </script>

</body>

</html>
