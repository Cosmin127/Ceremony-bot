<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ceremony bot thingy</title>

    <style>

        body {

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f4f4;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;

            padding: 30px;

        }

        .container {

            width: 550px;

            background: white;

            padding: 40px;

            box-shadow: 0 10px 25px rgba(0,0,0,.1);

        }

        h1 {

            margin-top: 0;
            text-align: center;

        }

        p {

            text-align: center;

        }

        .upload-box {

            border: 3px dashed #888;

            padding: 40px;

            margin: 25px 0;

        }

        input[type=file] {

            width: 100%;

        }

        .format,
        #excel-options {

            margin-top: 25px;

        }

        .format h3,
        #excel-options h3 {

            margin-bottom: 12px;

        }

        .format label {

            display: block;

            margin: 8px 0;

            cursor: pointer;

        }

        #excel-options input[type=text] {

            width: 100%;

            padding: 8px;

            box-sizing: border-box;

        }

        .checkbox-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px 20px;

            margin-top: 10px;

            margin-bottom: 20px;

        }

        .checkbox-grid label {

            cursor: pointer;

        }

        h4 {

            margin-bottom: 5px;
            margin-top: 20px;

        }

        button {

            margin-top: 30px;

            width: 100%;

            padding: 15px;

            font-size: 18px;

            cursor: pointer;

            border: none;

            background: #2b6cb0;

            color: white;

        }

        button:hover {

            background: #1f4f82;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Ceremony bot</h1>

    <p>Upload a ceremony document (.txt)</p>

    <form action="/generate"
          method="POST"
          enctype="multipart/form-data">

        <div class="upload-box">

            <input type="file"
                   name="file"
                   accept=".txt"
                   required>

        </div>

        <div class="format">

            <h3>Output format</h3>

            <label>
                <input type="radio"
                       name="output"
                       value="excel"
                       checked>
                Excel (.xlsx for medal sheet)
            </label>

            <label>
                <input type="radio"
                       name="output"
                       value="json">
                JSON (for Discord auto role bot)
            </label>

        </div>

        <div id="excel-options">

            <h3>Excel options</h3>

            <label>Reason</label>

            <input type="text"
                   name="reason"
                   placeholder="Reason">

            <br><br>

            <label>Logged By</label>

            <input type="text"
                   name="logged_by"
                   placeholder="Your name">

            <h3>Exclude Clasps</h3>

            <h4>Medals</h4>

            <div class="checkbox-grid">

                <label><input type="checkbox" name="exclude_bronze"> Bronze</label>

                <label><input type="checkbox" name="exclude_silver"> Silver (excluding social medals)</label>

                <label><input type="checkbox" name="exclude_gold"> Gold</label>

                <label><input type="checkbox" name="exclude_no"> No Clasp (social medals)</label>

            </div>

            <h4>Orders</h4>

            <div class="checkbox-grid">

                <label><input type="checkbox" name="exclude_knappe"> Knappe</label>

                <label><input type="checkbox" name="exclude_ritter"> Ritter</label>

                <label><input type="checkbox" name="exclude_kommandeur"> Kommandeur</label>

                <label><input type="checkbox" name="exclude_grossmeister"> Großmeister</label>

                <label><input type="checkbox" name="exclude_hochmeister"> Hochmeister</label>

            </div>

        </div>

        <button type="submit">

            Generate

        </button>

    </form>

</div>

<script>

const excelOptions = document.getElementById("excel-options");

const outputButtons = document.querySelectorAll('input[name="output"]');

function updateOutputOptions() {

    excelOptions.style.display =
        document.querySelector('input[name="output"]:checked').value === "excel"
            ? "block"
            : "none";

}

outputButtons.forEach(button =>
    button.addEventListener("change", updateOutputOptions)
);

updateOutputOptions();

</script>

</body>

</html>
