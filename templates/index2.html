<!DOCTYPE html>
<html lang="en"><head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ceremony Bot</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Subtle decorative border */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #a38a56, transparent);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-logo img {
            height: 350px;
            width: auto;
            opacity: 0.95;
        }

        .header .motto {
            color: #a38a56;
            font-family: 'Times New Roman', Times, serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-top: 8px;
            text-shadow: 0 0 40px rgba(163, 138, 86, 0.15);
        }

        .header .sub-motto {
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Times New Roman', Times, serif;
            font-size: 13px;
            letter-spacing: 6px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: rgba(163, 138, 86, 0.4);
            background: rgba(255, 255, 255, 0.04);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            opacity: 0.7;
        }

        .upload-area .label {
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            font-weight: 500;
        }

        .upload-area .sub-label {
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Times New Roman', Times, serif;
            font-size: 13px;
            margin-top: 6px;
        }

        .upload-area.dragover {
            border-color: #a38a56;
            background: rgba(163, 138, 86, 0.06);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Times New Roman', Times, serif;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input[type="text"]:focus {
            border-color: #a38a56;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px rgba(163, 138, 86, 0.05);
        }

        .form-group input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .toggle-group {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-group label {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            transition: all 0.3s ease;
            text-transform: none;
            letter-spacing: 0;
        }

        .toggle-group label:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .toggle-group input[type="radio"] {
            display: none;
        }

        .toggle-group input[type="radio"]:checked + label {
            background: rgba(163, 138, 86, 0.12);
            color: #a38a56;
            box-shadow: 0 4px 12px rgba(163, 138, 86, 0.06);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 4px;
        }

        .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.45);
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 400;
        }

        .checkbox-grid label:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.65);
        }

        .checkbox-grid input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .checkbox-grid input[type="checkbox"]:checked {
            background: #a38a56;
            border-color: #a38a56;
        }

        .checkbox-grid input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #1a1a2e;
            font-size: 11px;
            font-weight: 700;
        }

        .section-title {
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Times New Roman', Times, serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 18px 0 8px 0;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a38a56, #8a7448);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(163, 138, 86, 0.2);
            background: linear-gradient(135deg, #b89a64, #a38a56);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.06), transparent);
            margin: 24px 0;
        }

        .file-name {
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Times New Roman', Times, serif;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .file-name.show {
            display: block;
        }

        .file-name span {
            color: #a38a56;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .footer .motto {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .checkbox-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header-logo img {
                height: 80px;
            }
            .header .motto {
                font-size: 20px;
                letter-spacing: 2px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="header-logo">
            <img src="/static/eagle.png" alt="Austrian Eagle" id="eagleLogo">
        </div>

        <div class="motto">Meritocracy Reigns Supreme.</div>
        

    </div>

    <form action="/generate" method="POST" enctype="multipart/form-data">

        <div class="upload-area" id="dropZone">
            <span class="upload-icon">📜</span>
            <div class="label">Drop your .txt file here</div>
            <div class="sub-label">or click to browse</div>
            <input type="file" name="file" accept=".txt" required="" id="fileInput">
            <div class="file-name" id="fileName">Selected: <span id="fileNameText"></span></div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Reason</label>
                <input type="text" name="reason" placeholder="e.g. Campaign Medal">
            </div>
            <div class="form-group">
                <label>Logged By</label>
                <input type="text" name="logged_by" placeholder="Your Roblox username">
            </div>
        </div>

        <div class="form-group">
            <label>Ceremony Format</label>
            <div class="toggle-group">
                <input type="radio" name="ceremony_type" value="eu_na" id="eu_na" checked="">
                <label for="eu_na">🌎 EU / NA</label>
                <input type="radio" name="ceremony_type" value="asia" id="asia">
                <label for="asia">🌏 Asia</label>
            </div>
        </div>

        <div class="form-group">
            <label>Output Format</label>
            <div class="toggle-group">
                <input type="radio" name="output" value="excel" id="excel" checked="">
                <label for="excel">📊 Excel</label>
                <input type="radio" name="output" value="json" id="json">
                <label for="json">📋 JSON</label>
            </div>
        </div>

        <div id="excel-options" style="display: block;">
            

            <div class="section-title">Exclude Clasps</div>

            <div style="color: rgba(255,255,255,0.3); font-family: 'Times New Roman', Times, serif; font-size: 12px; margin-bottom: 10px; letter-spacing: 1px;">Medals</div>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="exclude_bronze"> Bronze</label>
                <label><input type="checkbox" name="exclude_silver"> Silver</label>
                <label><input type="checkbox" name="exclude_gold"> Gold</label>
                <label><input type="checkbox" name="exclude_no"> No Clasp</label>
            </div>

            <div style="color: rgba(255,255,255,0.3); font-family: 'Times New Roman', Times, serif; font-size: 12px; margin-top: 12px; margin-bottom: 10px; letter-spacing: 1px;">Orders</div>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="exclude_knappe"> Knappe</label>
                <label><input type="checkbox" name="exclude_ritter"> Ritter</label>
                <label><input type="checkbox" name="exclude_kommandeur"> Kommandeur</label>
                <label><input type="checkbox" name="exclude_grossmeister"> Großmeister</label>
                <label><input type="checkbox" name="exclude_hochmeister"> Hochmeister</label>
            </div>
        </div>

        <button type="submit" class="btn-submit">Generate</button>

    </form>

    

</div>

<script>

    // File upload drag & drop
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const fileNameText = document.getElementById('fileNameText');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            updateFileName();
        }
    });

    fileInput.addEventListener('change', updateFileName);

    function updateFileName() {
        if (fileInput.files.length) {
            fileNameText.textContent = fileInput.files[0].name;
            fileName.classList.add('show');
        } else {
            fileName.classList.remove('show');
        }
    }

    // Toggle Excel options visibility
    const excelOptions = document.getElementById('excel-options');
    const outputButtons = document.querySelectorAll('input[name="output"]');

    function updateOutputOptions() {
        const selected = document.querySelector('input[name="output"]:checked');
        excelOptions.style.display = selected && selected.value === 'excel' ? 'block' : 'none';
    }

    outputButtons.forEach(button => {
        button.addEventListener('change', updateOutputOptions);
    });

    updateOutputOptions();

    // Handle missing eagle image gracefully
    document.getElementById('eagleLogo').addEventListener('error', function() {
        this.style.display = 'none';
    });

</script>



</body></html>
