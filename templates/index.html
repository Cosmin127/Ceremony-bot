<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ceremony bot thingy</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {

            width: 500px;
            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 10px 25px rgba(0,0,0,0.1);

            text-align: center;

        }

        h1 {
            margin-top: 0;
        }

        .upload-box {

            border: 3px dashed #888;

            border-radius: 10px;

            padding: 40px;

            margin: 25px 0;

        }

        input[type=file]{

            width:100%;

        }

        button{

            margin-top:20px;

            width:100%;

            padding:15px;

            font-size:18px;

            cursor:pointer;

            border:none;

            border-radius:8px;

            background:#2b6cb0;

            color:white;

        }

        button:hover{

            background:#1f4f82;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Ceremony bot thingy</h1>

    <p>
        upload a ceremony document pls (.txt)
    </p>

    <form
        action="/generate"
        method="POST"
        enctype="multipart/form-data">

        <div class="upload-box">

            <input
                type="file"
                name="file"
                accept=".txt"
                required>

        </div>

        <button type="submit">

            Generate Excel

        </button>

    </form>

</div>

</body>

</html>
